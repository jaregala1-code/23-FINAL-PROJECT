org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# AGP 9.0 (January 2026) changed the DSL contract AND made Kotlin built-in.
# Flutter 3.41.x doesn't yet fully support either, so opt out of both until
# the Flutter SDK + first-party plugins finish their AGP-9 migration.
# Sources:
#   https://developer.android.com/build/releases/agp-9-0-0-release-notes
#   https://github.com/flutter/flutter/issues/180137  (Flutter's AGP-9 tracker)
android.newDsl=false
android.builtInKotlin=false