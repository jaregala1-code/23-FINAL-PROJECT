org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 8.7+ / 9 introduces a `generateLockfiles` task that collides with the
# Flutter Gradle plugin. Opt out of the new DSL until the Flutter SDK ships
# a Gradle plugin that's compatible.
android.newDsl=false
# Fallback flag — different Flutter releases honour different spellings, so we
# set both. Drop these once `flutter upgrade` produces a plugin that no longer
# fights with AGP's new task.
android.experimental.newDsl=false