name: project_cmsc23
description: "ELBites — Elbi Food Sharing App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0

  # State management
  provider: ^6.1.5+1

  # Camera & image picking
  image_picker: ^1.1.2

  # Geolocation 
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # Date formatting 
  intl: ^0.20.2

  # other utilities
  
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Soras
      fonts:
        - asset: fonts/Sora-Regular.ttf
          weight: 400
        - asset: fonts/Sora-Light.ttf
          weight: 300
        - asset: fonts/Sora-Medium.ttf
          weight: 500
        - asset: fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: fonts/Sora-Bold.ttf
          weight: 700
        - asset: fonts/Sora-ExtraBold.ttf
          weight: 800